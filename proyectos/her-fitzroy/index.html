    .proj-gallery { max-width: 1200px; margin: 0 auto; padding: 0 48px 120px; }

    .grid-featured {

    .photo-item {

      bottom: 10px;

      background-size: contain;

      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, filter 0.3s ease;
      filter: grayscale(10%);
    }
    .photo-item:hover img { transform: scale(1.04); filter: grayscale(0%); }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;

    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      font-size: 28px;

      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
    }
    .lightbox-close:hover { color: var(--text); }
    .lightbox-nav {

      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 36px;
      cursor: pointer;
      padding: 16px;
      transition: color 0.2s;
      z-index: 2;
    }
    .lightbox-nav:hover { color: #fff; }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

<script>
  const galleryPhotos = [
    { file: 'fitz-01', alt: 'HER Fitz Roy interior' },
    { file: 'fitz-02', alt: 'HER Fitz Roy fachada' },
    { file: 'fitz-03', alt: 'HER Fitz Roy restaurante' },
    { file: 'fitz-04', alt: 'HER Fitz Roy fachada árbol' },
    { file: 'fitz-05', alt: 'HER Fitz Roy cartel' },
    { file: 'fitz-06', alt: 'HER Fitz Roy entrada' },
    { file: 'fitz-07', alt: 'HER Fitz Roy habitación vista ciudad' },
    { file: 'fitz-08', alt: 'HER Fitz Roy estudio' },
    { file: 'fitz-09', alt: 'HER Fitz Roy balcón' },
    { file: 'fitz-10', alt: 'HER Fitz Roy escalera mural' },
    { file: 'fitz-11', alt: 'HER Fitz Roy pantalla decorativa' },
    { file: 'fitz-12', alt: 'HER Fitz Roy detalle panel' },
  ];

  let currentIndex = 0;
  let lightboxGen = 0;

  function applyWatermarkToLightbox(src) {
    const myGen = ++lightboxGen;
    const lightboxImg = document.getElementById('lightboxImg');
    lightboxImg.alt = galleryPhotos[currentIndex]?.alt || '';
    lightboxImg.src = src;

    const photo = new Image();
    photo.onload = function() {
      if (lightboxGen !== myGen) return;
      const W = photo.naturalWidth;
      const H = photo.naturalHeight;
      const isPortrait = H > W;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(photo, 0, 0);

      const logo = new Image();
      logo.onload = function() {
        if (lightboxGen !== myGen) return;
        const pct = isPortrait ? 0.20 : 0.08;
        const logoW = Math.round(W * pct);
        const logoH = Math.round(logoW * 40 / 180);
        const pad = Math.round(Math.min(W, H) * 0.025);

        ctx.globalAlpha = 0.35;
        ctx.drawImage(logo, pad, H - logoH - pad, logoW, logoH);
        try { lightboxImg.src = canvas.toDataURL('image/jpeg', 0.92); } catch(e) {}
      };
      logo.src = '../../logos/logo-blanco.svg';
    };
    photo.src = src;
  }

  function openLightbox(idx) {
    currentIndex = idx;
    applyWatermarkToLightbox(`imgs/${galleryPhotos[idx].file}.webp`);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function lightboxStep(dir) {
    currentIndex = (currentIndex + dir + galleryPhotos.length) % galleryPhotos.length;
    applyWatermarkToLightbox(`imgs/${galleryPhotos[currentIndex].file}.webp`);
  }
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') lightboxStep(1);
    if (e.key === 'ArrowLeft') lightboxStep(-1);
  });
</script>
